name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  package:
    name: Package and production dependency checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run smoke:package
      - run: npm audit --audit-level=high
      - run: npm audit --omit=dev --audit-level=moderate

  coverage:
    name: Coverage thresholds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  linux-egress:
    name: Required Ubuntu Linux egress enforcement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: node:22-bookworm
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install and check namespace prerequisites
        run: |
          apt-get update
          apt-get install --yes util-linux iproute2 curl
          command -v unshare
          command -v ip
          unshare --version
          ip link show lo
          unshare --user --map-root-user --net --mount --pid --fork --kill-child=SIGTERM --mount-proc --propagation private -- true
      - run: npm ci
      - name: Run required Linux enforcement tests
        env:
          GHOSTAPI_REQUIRE_LINUX_EGRESS: "1"
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/.ghostapi-ci"
          timeout 300s npm test -- --run test/egressRun.test.ts --reporter=verbose | tee "$GITHUB_WORKSPACE/.ghostapi-ci/egress-vitest.log"
          grep -F "allows GhostAPI loopback and preserves the target exit code" "$GITHUB_WORKSPACE/.ghostapi-ci/egress-vitest.log"
          grep -F "blocks fetch, https, direct IP, and child-process bypass attempts" "$GITHUB_WORKSPACE/.ghostapi-ci/egress-vitest.log"
          grep -F "blocks curl executed by the target" "$GITHUB_WORKSPACE/.ghostapi-ci/egress-vitest.log"
          if grep -E "[0-9]+ skipped|SKIP" "$GITHUB_WORKSPACE/.ghostapi-ci/egress-vitest.log"; then
            echo "Linux egress enforcement tests must execute without skips."
            exit 1
          fi
      - name: Upload Linux egress test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-egress-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ghostapi-ci/egress-vitest.log
          if-no-files-found: error
          retention-days: 30

  hosted:
    name: Hosted pilot checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hosted
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: npm ci
      - run: bun run typecheck
      - run: bun test
      - run: npm audit --omit=dev --audit-level=high

  hosted-docker:
    name: Hosted Docker build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: docker build --file hosted/Dockerfile --tag ghostapi-hosted-ci hosted
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ghostapi-hosted-ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
