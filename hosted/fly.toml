app = "ghostapi-hosted-pilot"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[processes]
  app = "bun dist/server.js"
  dispatcher = "bun dist/dispatcher.js"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 2
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/readyz"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1024mb"
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["dispatcher"]
