app = "ghostapi-hosted-pilot"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[processes]
  app = "bun src/server.ts"
  dispatcher = "bun src/dispatcher.ts"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 2
  processes = ["app"]

[[vm]]
  size = "shared-cpu-2x"
  memory = "1024mb"
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["dispatcher"]
