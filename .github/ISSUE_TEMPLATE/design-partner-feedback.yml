name: Design-partner feedback
description: Capture a structured, sanitized workflow-validation signal.
title: "[Design partner]: "
labels: ["design-partner", "feedback"]
body:
  - type: markdown
    attributes:
      value: "Do not include source code, raw traffic, credentials, tokens, personal data, customer names, or confidential incident details."
  - type: dropdown
    id: signal
    attributes:
      label: Signal type
      options:
        - Discovery interview
        - Onboarding feedback
        - Weekly CI usage
        - Enforcement value
        - Inconclusive
    validations:
      required: true
  - type: input
    id: segment
    attributes:
      label: Company segment and engineering size
      placeholder: B2B SaaS, 20-80 engineers
    validations:
      required: true
  - type: input
    id: role
    attributes:
      label: Participant role
      placeholder: Platform lead
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Workflow and current workaround
      description: Describe the integration/risk without sensitive payloads.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Observed evidence and next action
      description: Include a sanitized reference, not logs or artifacts containing sensitive data.
    validations:
      required: true
