version: 1
network:
  default: deny
  allow:
    - host: localhost
    - host: 127.0.0.1
    - provider: stripe
  deny:
    - host: api.stripe.com
  productionHosts:
    - "*.stripe.com"
credentials:
  forbid:
    - sk_live_*
    - ghp_*
requiredScenarios:
  - stripe.card_declined
enforcement:
  allowedModes:
    - linux-network-namespace
reports:
  maxProductionEgressAttempts: 0
  maxForbiddenCredentialMatches: 0
